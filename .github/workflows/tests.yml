name: tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
