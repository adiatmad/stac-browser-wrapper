name: tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31.0"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  ui-dependency-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify shadcn Components V2 runtime compatibility
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import streamlit
          import streamlit_shadcn_ui as ui

          installed = version("streamlit")
          assert tuple(int(part) for part in installed.split(".")[:2]) >= (1, 60), installed
          for name in ("card", "badge", "metric_card"):
              assert callable(getattr(ui, name, None)), f"Missing shadcn component: {name}"
          print(f"Streamlit {installed}; shadcn card/badge/metric_card imports passed.")
          PY
